[package]
name = "nanoharness"
version = "0.1.0"
edition = "2024"
description = "A tiny Rust harness for Codex and Anthropic"
license = "MIT"
repository = "https://github.com/shubhxho/nanoharness"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
rpassword = "7"
ratatui = "0.29"
crossterm = "0.28"
