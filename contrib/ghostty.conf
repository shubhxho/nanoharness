# nanoharness + Ghostty
# Copy snippets into ~/.config/ghostty/config (or merge with your config).
#
# Ghostty sets TERM_PROGRAM=ghostty and COLORTERM=truecolor; nanoharness
# detects that and enables focus reporting plus truecolor-aware rendering.

# Quick launch: type nanoharness + Enter in the active shell.
keybind = super+shift+n=text:nanoharness\r

# Optional: open a dedicated tab running nanoharness (adjust path if needed).
# keybind = super+shift+h=new_tab,text:nanoharness\r

# Keep truecolor hints available to child processes (Ghostty usually sets these).
env = COLORTERM=truecolor
